<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<style>
  .wire { stroke: #a371f7; stroke-opacity: .45; stroke-width: 1.5; stroke-dasharray: 4 8; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#17122e"/></linearGradient>
  <radialGradient id="glow" cx=".75" cy=".5" r=".45"><stop offset="0" stop-color="#8957e5" stop-opacity=".38"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine" x1="0" x2="700" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
    <stop offset="0" stop-color="#e6edf3"/><stop offset=".35" stop-color="#a371f7"/><stop offset=".65" stop-color="#58a6ff"/><stop offset="1" stop-color="#e6edf3"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="700 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#8957e5" stop-opacity="0"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-opacity=".45"/></pattern>
  <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="m"><rect width="1200" height="300" fill="url(#fadeR)"/></mask>
  <clipPath id="clip"><rect width="1200" height="300" rx="14"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g mask="url(#m)"><rect y="-40" width="1200" height="380" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="5s" repeatCount="indefinite"/></rect></g>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <line x1="900" y1="150" x2="1060" y2="62" class="wire"/><line x1="900" y1="150" x2="1110" y2="175" class="wire"/><line x1="900" y1="150" x2="1010" y2="255" class="wire"/><line x1="900" y1="150" x2="790" y2="245" class="wire"/><line x1="900" y1="150" x2="760" y2="70" class="wire"/>
  <circle r="3" fill="#58a6ff"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M900,150 L1060,62"/></circle><circle r="3" fill="#58a6ff"><animateMotion dur="2.4s" begin="0.45s" repeatCount="indefinite" path="M900,150 L1110,175"/></circle><circle r="3" fill="#58a6ff"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite" path="M900,150 L1010,255"/></circle><circle r="3" fill="#58a6ff"><animateMotion dur="2.4s" begin="1.35s" repeatCount="indefinite" path="M900,150 L790,245"/></circle><circle r="3" fill="#58a6ff"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M900,150 L760,70"/></circle>
  <circle cx="1060" cy="62" r="7" fill="#a371f7"><animate attributeName="r" values="7;9;7" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="1110" cy="175" r="7" fill="#a371f7"><animate attributeName="r" values="7;9;7" dur="2.4s" begin="0.45s" repeatCount="indefinite"/></circle><circle cx="1010" cy="255" r="7" fill="#a371f7"><animate attributeName="fill" dur="7s" repeatCount="indefinite" values="#a371f7;#a371f7;#f85149;#f85149;#3fb950;#a371f7" keyTimes="0;.45;.5;.62;.7;1"/><animate attributeName="r" values="7;9;7" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle><circle cx="790" cy="245" r="7" fill="#a371f7"><animate attributeName="r" values="7;9;7" dur="2.4s" begin="1.35s" repeatCount="indefinite"/></circle><circle cx="760" cy="70" r="7" fill="#a371f7"><animate attributeName="r" values="7;9;7" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="150" r="26" fill="none" stroke="#a371f7" stroke-opacity=".5">
    <animate attributeName="r" values="18;40" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".6;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="150" r="16" fill="#0d1117" stroke="#a371f7" stroke-width="3"/>
  <circle cx="900" cy="150" r="6" fill="#e6edf3"/>
  <g>
    <text x="72" y="104" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="16" fill="#a371f7">&gt; DizzyMii</text>
    <text x="68" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#shine)">Kade Heglin</text>
    <text x="72" y="214" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="19" fill="#8b949e">agent tooling · claude skills · minecraft mods</text>
  </g>
  <rect y="297" width="1200" height="3" fill="url(#edge)"/>
